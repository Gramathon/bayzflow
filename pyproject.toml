[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayzflow"
dynamic = ["version"]
description = "Bayesian deep learning for selective Bayesian inference and uncertainty analysis in PyTorch models"
readme = "README.md"
authors = [
    { name = "BayzFlow Contributors" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    "pyro-ppl>=1.9.0",
    "numpy>=1.21.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
fx = [
    "yfinance>=0.2.0",
    "pandas>=1.3.0",
    "ta>=0.10.0",
]

medical = [
    "monai>=1.0.0",
    "nibabel>=3.2.0",
]

viz = [
    "matplotlib>=3.5.0",
]

dev = [
    "pytest>=7.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

mcp = [
    "mcp>=2.0.0,<3.0.0",
]

all = [
    "yfinance>=0.2.0",
    "pandas>=1.3.0",
    "ta>=0.10.0",
    "monai>=1.0.0",
    "nibabel>=3.2.0",
    "matplotlib>=3.5.0",
    "pytest>=7.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "mcp>=2.0.0,<3.0.0",
]

[project.scripts]
bayzflow = "bayzflow.cli:main"
bayzflow-mcp = "bayzflow.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Gramathon/bayzflow"
Documentation = "https://github.com/Gramathon/bayzflow#readme"
Repository = "https://github.com/Gramathon/bayzflow"
"Bug Tracker" = "https://github.com/Gramathon/bayzflow/issues"

[tool.setuptools.dynamic]
version = {attr = "bayzflow._version.__version__"}

[tool.setuptools.packages.find]
include = ["bayzflow*"]
exclude = ["bayzflow.research*", "bayzflow.observability*", "bayzflow.archive*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
bayzflow = ["*.yaml", "resources/skills/bayesian-inference/**/*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
