name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv ruff mypy
      - run: ruff check bayzflow/guides bayzflow/cli.py bayzflow/mcp bayzflow/core/engine.py bayzflow/core/experiment.py bayzflow/examples/guide_benchmark.py tests examples/expcon
      - run: mypy --follow-imports=skip --ignore-missing-imports bayzflow/guides bayzflow/mcp
      - name: Build candidate from commit
        run: uv build
      - name: Install wheel into a clean CPU environment
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/installed"
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" --index https://download.pytorch.org/whl/cpu 'torch>=2.6.0'
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" 'dist/bayzflow-0.2.0-py3-none-any.whl[mcp]' pytest 'setuptools>=78.1.1'
          uv pip check --python "$RUNNER_TEMP/installed/bin/python"
      - name: Test installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          bin="$RUNNER_TEMP/installed/bin"
          "$bin/python" -c 'import bayzflow, pathlib, sys; assert pathlib.Path(bayzflow.__file__).is_relative_to(sys.prefix)'
          "$bin/bayzflow" --version | grep -Fx 0.2.0
          "$bin/bayzflow" doctor
          "$bin/bayzflow" guide list
          "$bin/bayzflow" skill status
          "$bin/bayzflow" skill install --target "$RUNNER_TEMP/skill"
          "$bin/python" -m pytest -q "$GITHUB_WORKSPACE/tests"
      - name: Compare guides against the analytical posterior
        if: matrix.python-version == '3.12'
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/installed/bin/python" -m bayzflow.examples.guide_benchmark --output "$RUNNER_TEMP/benchmark" --seed 19
          python -c 'import json, pathlib, sys; m = json.loads(pathlib.Path(sys.argv[1]).read_text()); assert len(m["runs"]) == 5 and m["max_mean_l2_error"] <= 0.35' "$RUNNER_TEMP/benchmark/metrics.json"
      - name: Record candidate checksums and runtime SBOM
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install cyclonedx-bom twine pip-audit
          "$RUNNER_TEMP/installed/bin/python" -c 'import importlib.metadata as m; print("\n".join(sorted(d.metadata["Name"] + "==" + d.version.split("+", 1)[0] for d in m.distributions() if d.metadata["Name"].lower() != "bayzflow")))' > "$RUNNER_TEMP/runtime-requirements.txt"
          pip-audit --no-deps --disable-pip --requirement "$RUNNER_TEMP/runtime-requirements.txt"
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          cyclonedx-py environment "$RUNNER_TEMP/installed/bin/python" --output-file dist/runtime-sbom.json
          printf '%s\n' "$(git rev-parse HEAD)" > dist/SOURCE_COMMIT
          cp "$RUNNER_TEMP/benchmark/metrics.json" dist/benchmark.json
          cd dist
          sha256sum *.whl *.tar.gz runtime-sbom.json SOURCE_COMMIT benchmark.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python-version == '3.12'
        with:
          name: bayzflow-candidate
          path: dist/
          if-no-files-found: error

  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit detect-secrets==1.5.0
      - run: bandit -r bayzflow/guides bayzflow/mcp -lll -iii
      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, source-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bayzflow-candidate
          path: candidate
      - working-directory: candidate
        run: |
          sha256sum -c SHA256SUMS
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: candidate/*
