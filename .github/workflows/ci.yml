name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,mcp]'
      - run: ruff check bayzflow/guides bayzflow/cli.py bayzflow/mcp bayzflow/core/engine.py bayzflow/core/experiment.py tests/test_guides_engine.py tests/test_interfaces.py tests/test_experiment_runner.py
      - run: mypy bayzflow/guides bayzflow/mcp
      - run: python -m pytest -q tests/test_guides_engine.py tests/test_interfaces.py tests/test_experiment_runner.py
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: bayzflow --version
      - run: bayzflow doctor
      - run: bayzflow guide list
      - run: bayzflow skill status

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit --requirement <(python -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml","rb"))["project"]["dependencies"]))')
