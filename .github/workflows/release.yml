name: Publish validated release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run: ${{ steps.candidate.outputs.ci_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select a verified main candidate
        id: candidate
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged_commit=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            --jq '.object | select(.type == "commit") | .sha')
          [[ "$tagged_commit" == "$SOURCE_COMMIT" ]]
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          [[ "$(gh api "repos/$GH_REPO/commits/$SOURCE_COMMIT" --jq '.commit.verification.verified')" == true ]]

          run=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f head_sha="$SOURCE_COMMIT" \
            -F per_page=1 --jq '.workflow_runs[0].id // empty')
          [[ "$run" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::The tagged commit needs a successful main CI run. Rerun this workflow after CI passes."
            exit 1
          }
          printf 'ci_run=%s\n' "$run" >> "$GITHUB_OUTPUT"

  publish:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}
      CI_RUN: ${{ needs.source.outputs.ci_run }}
    steps:
      # The publication job executes no code from the repository checkout or candidate.
      - name: Download and verify the exact CI assets
        run: |
          gh run download "$CI_RUN" --name bayzflow-candidate --dir candidate
          version="${RELEASE_TAG#v}"
          cd candidate
          sha256sum "bayzflow-$version-py3-none-any.whl" "bayzflow-$version.tar.gz" \
            runtime-sbom.json SOURCE_COMMIT benchmark.json | cmp SHA256SUMS -
          [[ "$(cat SOURCE_COMMIT)" == "$SOURCE_COMMIT" ]]
          for file in SHA256SUMS "bayzflow-$version-py3-none-any.whl" "bayzflow-$version.tar.gz" \
                      runtime-sbom.json SOURCE_COMMIT benchmark.json; do
            gh attestation verify "$file" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/ci.yml" \
              --source-ref refs/heads/main --source-digest "$SOURCE_COMMIT" --deny-self-hosted-runners
          done
      - name: Verify draft assets and publish
        run: |
          version="${RELEASE_TAG#v}"
          files=(SHA256SUMS "bayzflow-$version-py3-none-any.whl" "bayzflow-$version.tar.gz"
                 SOURCE_COMMIT runtime-sbom.json benchmark.json)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          fi
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for file in "${files[@]}"; do
            if ! grep -Fxq -- "$file" <<<"$assets"; then
              [[ "$draft" == true ]]
              gh release upload "$RELEASE_TAG" "candidate/$file"
            fi
          done
          [[ "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" == "${#files[@]}" ]]
          dest="$RUNNER_TEMP/bayzflow-release-verification"
          gh release download "$RELEASE_TAG" --dir "$dest"
          for file in "${files[@]}"; do
            cmp "candidate/$file" "$dest/$file"
          done
          tagged_commit=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            --jq '.object | select(.type == "commit") | .sha')
          [[ "$tagged_commit" == "$SOURCE_COMMIT" ]]
          if [[ "$draft" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          url=$(gh release view "$RELEASE_TAG" --json isDraft,isImmutable,url \
            --jq 'select(.isDraft == false and .isImmutable == true) | .url')
          [[ "$url" == "$GITHUB_SERVER_URL/$GH_REPO/releases/tag/$RELEASE_TAG" ]]
          echo "$url"
